<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to BBCC Skill Hub</title>
    <link rel="icon" type="image/png" href="/data/branding/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .maintenance-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 48px 36px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .heading {
            font-size: 28px;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .subtext {
            font-size: 16px;
            color: #94a3b8;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .btn-login {
            display: inline-block;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 36px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }

        .btn-login:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <h1 class="heading">Welcome to BBCC Skill Hub</h1>
        <p class="subtext">Website is Under Maintenance. Please try again later.</p>
        <a href="/login.html" class="btn-login">Login</a>
    </div>

</body>
</html>
