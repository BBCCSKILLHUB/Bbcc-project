<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutional Portal Login - BBCC Skill Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 10% 20%, #0d1322 0%, #060913 90%);
            padding: 20px;
            color: #ffffff;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.08) 0%, transparent 70%);
            top: -100px;
            left: -100px;
            border-radius: 50%;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, transparent 70%);
            bottom: -100px;
            right: -100px;
            border-radius: 50%;
            pointer-events: none;
        }

        .login-card {
            background: rgba(18, 24, 40, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            padding: 45px 35px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 215, 0, 0.05);
            max-width: 460px;
            width: 100%;
            position: relative;
            z-index: 10;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-crest {
            text-align: center;
            margin-bottom: 25px;
        }

        .crest-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 12px;
            background: linear-gradient(135deg, #ffd700 0%, #f59e0b 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: #0b0f19;
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.2);
        }

        .portal-title {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 0.05em;
            background: linear-gradient(135deg, #ffffff 40%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            line-height: 1.2;
        }

        .portal-subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-top: 6px;
            font-weight: 500;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .role-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 4px;
            margin: 25px 0 20px;
        }

        .role-btn {
            flex: 1;
            padding: 10px 14px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .role-btn.active {
            background: linear-gradient(135deg, #ffd700 0%, #f59e0b 100%);
            color: #0b0f19;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        .role-badge-notice {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 13px 15px 13px 44px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.04);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffd700 0%, #f59e0b 100%);
            border: none;
            border-radius: 12px;
            color: #0b0f19;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.25);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(245, 158, 11, 0.35);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .error-msg.show {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer-links {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        .footer-links a {
            color: #ffd700;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-crest">
            <div class="crest-icon">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <div class="portal-title">BBCC SKILL HUB</div>
            <div class="portal-subtitle">Institutional Board & Coaching Portal</div>
        </div>

        <div class="role-tabs">
            <button type="button" class="role-btn active" id="tabSuperAdmin" onclick="setRole('super_admin')">
                <i class="fas fa-shield-alt"></i> Master Board
            </button>
            <button type="button" class="role-btn" id="tabDirector" onclick="setRole('coaching_director')">
                <i class="fas fa-building"></i> Coaching Center
            </button>
        </div>

        <div class="role-badge-notice" id="roleNotice">
            <i class="fas fa-info-circle"></i>
            <span id="roleNoticeText">Master BBCC Board administrative control login</span>
        </div>

        <div class="error-msg" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText"></span>
        </div>

        <form id="portalLoginForm">
            <div class="form-group">
                <label for="usernameInput" id="usernameLabel">Admin / Master ID</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="usernameInput" placeholder="Enter Master Admin ID" value="santosh" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="passwordInput">Secret Key / Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="passwordInput" placeholder="Enter your password" value="santosh" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span>Access Portal</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="footer-links">
            <a href="/"><i class="fas fa-home"></i> Back to University Website</a>
            <div style="margin-top: 8px;">© 2026 BBCC Skill Hub. All Rights Reserved.</div>
        </div>
    </div>

    <script>
        let selectedRole = 'super_admin';

        function setRole(role) {
            selectedRole = role;
            const tabSuper = document.getElementById('tabSuperAdmin');
            const tabDir = document.getElementById('tabDirector');
            const noticeText = document.getElementById('roleNoticeText');
            const userLabel = document.getElementById('usernameLabel');
            const userInput = document.getElementById('usernameInput');
            const passInput = document.getElementById('passwordInput');

            if (role === 'super_admin') {
                tabSuper.classList.add('active');
                tabDir.classList.remove('active');
                noticeText.textContent = 'Master BBCC Board administrative control login';
                userLabel.textContent = 'Admin / Master ID';
                userInput.placeholder = 'Enter Master Admin ID';
                userInput.value = 'santosh';
                passInput.value = 'santosh';
            } else {
                tabDir.classList.add('active');
                tabSuper.classList.remove('active');
                noticeText.textContent = 'Affiliated Coaching Institute Director login';
                userLabel.textContent = 'Director Username / Center Code';
                userInput.placeholder = 'e.g. center_101 or email';
                userInput.value = '';
                passInput.value = '';
            }
        }

        document.getElementById('portalLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const errorBox = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const submitBtn = document.getElementById('submitBtn');

            errorBox.classList.remove('show');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userRole', data.role);
                    localStorage.setItem('userData', JSON.stringify(data.user));

                    if (data.role === 'super_admin') {
                        localStorage.setItem('admin', JSON.stringify(data.user));
                        window.location.href = data.redirectUrl || '/management';
                    } else if (data.role === 'coaching_director') {
                        localStorage.setItem('centerData', JSON.stringify(data.user));
                        window.location.href = data.redirectUrl || '/coaching-dashboard';
                    } else {
                        window.location.href = '/management';
                    }
                } else {
                    errorText.textContent = data.message || 'Authentication failed. Please verify credentials.';
                    errorBox.classList.add('show');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Access Portal</span> <i class="fas fa-arrow-right"></i>';
                }
            } catch (err) {
                errorText.textContent = 'Server connection error. Please try again.';
                errorBox.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Access Portal</span> <i class="fas fa-arrow-right"></i>';
            }
        });
    </script>
    <script src="/bharti-ai.js"></script>
</body>
</html>
