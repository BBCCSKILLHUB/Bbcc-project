<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBCC Skill Hub Login</title>
    <link rel="icon" type="image/png" href="/data/branding/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
        }

        .login-heading {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-input {
            width: 100%;
            padding: 13px 16px;
            font-size: 15px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            color: #0f172a;
            background: #ffffff;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .form-input::placeholder {
            color: #94a3b8;
        }

        .otp-input {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 8px;
        }

        .btn-action {
            width: 100%;
            padding: 13px;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            background: #2563eb;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: #1d4ed8;
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-alert {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13.5px;
            margin-bottom: 18px;
            display: none;
            line-height: 1.4;
        }

        .status-alert.error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .status-alert.success {
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .sub-action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            font-size: 13px;
        }

        .text-link {
            background: none;
            border: none;
            color: #2563eb;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            padding: 0;
        }

        .text-link:hover {
            text-decoration: underline;
        }

        .text-link:disabled {
            color: #94a3b8;
            cursor: not-allowed;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1 class="login-heading">BBCC Skill Hub Login</h1>

        <div id="statusAlert" class="status-alert"></div>

        <!-- STEP 1: EMAIL INPUT -->
        <div id="stepEmail">
            <div class="form-group">
                <input 
                    type="email" 
                    id="emailInput" 
                    class="form-input" 
                    placeholder="Enter your email" 
                    autocomplete="email"
                    required
                >
            </div>
            <button type="button" id="btnSendOtp" class="btn-action" onclick="handleSendOtp()">
                Send OTP
            </button>
        </div>

        <!-- STEP 2: OTP INPUT -->
        <div id="stepOtp" style="display: none;">
            <div class="form-group">
                <input 
                    type="text" 
                    id="otpInput" 
                    class="form-input otp-input" 
                    maxlength="4" 
                    placeholder="••••" 
                    autocomplete="one-time-code"
                >
            </div>
            <button type="button" id="btnVerifyOtp" class="btn-action" onclick="handleVerifyOtp()">
                Verify &amp; Log In
            </button>
            <div class="sub-action-row">
                <button type="button" class="text-link" onclick="handleChangeEmail()">Change Email</button>
                <button type="button" id="btnResend" class="text-link" onclick="handleSendOtp(true)">Resend OTP</button>
            </div>
        </div>
    </div>

    <script>
        let resendTimer = null;
        let resendSeconds = 30;

        function showAlert(msg, isError = true) {
            const el = document.getElementById('statusAlert');
            el.className = 'status-alert ' + (isError ? 'error' : 'success');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function clearAlert() {
            const el = document.getElementById('statusAlert');
            el.style.display = 'none';
            el.textContent = '';
        }

        function startResendCountdown() {
            clearInterval(resendTimer);
            resendSeconds = 30;
            const resendBtn = document.getElementById('btnResend');
            resendBtn.disabled = true;
            resendBtn.textContent = `Resend (${resendSeconds}s)`;

            resendTimer = setInterval(() => {
                resendSeconds--;
                if (resendSeconds <= 0) {
                    clearInterval(resendTimer);
                    resendBtn.disabled = false;
                    resendBtn.textContent = 'Resend OTP';
                } else {
                    resendBtn.textContent = `Resend (${resendSeconds}s)`;
                }
            }, 1000);
        }

        async function handleSendOtp(isResend = false) {
            const emailInput = document.getElementById('emailInput');
            const email = (emailInput?.value || '').trim().toLowerCase();
            const btn = document.getElementById('btnSendOtp');

            if (!email || !email.includes('@')) {
                showAlert('Please enter a valid email address.', true);
                emailInput?.focus();
                return;
            }

            clearAlert();
            if (!isResend) {
                btn.disabled = true;
                btn.textContent = 'Sending OTP...';
            }

            try {
                const res = await fetch('/api/auth/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    document.getElementById('stepEmail').style.display = 'none';
                    document.getElementById('stepOtp').style.display = 'block';
                    document.getElementById('otpInput').value = '';
                    document.getElementById('otpInput').focus();
                    showAlert('OTP has been sent to ' + email, false);
                    startResendCountdown();
                } else {
                    showAlert(data.message || 'Failed to send OTP. Please try again.', true);
                }
            } catch (err) {
                showAlert('Network error: ' + err.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send OTP';
            }
        }

        function handleChangeEmail() {
            document.getElementById('stepOtp').style.display = 'none';
            document.getElementById('stepEmail').style.display = 'block';
            document.getElementById('emailInput').focus();
            clearAlert();
        }

        async function handleVerifyOtp() {
            const email = (document.getElementById('emailInput')?.value || '').trim().toLowerCase();
            const otpInput = document.getElementById('otpInput');
            const otp = (otpInput?.value || '').trim();
            const btn = document.getElementById('btnVerifyOtp');

            if (!otp || otp.length < 4) {
                showAlert('Please enter the 4-digit OTP.', true);
                otpInput?.focus();
                return;
            }

            clearAlert();
            btn.disabled = true;
            btn.textContent = 'Verifying...';

            try {
                const res = await fetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp })
                });

                const data = await res.json();

                if (res.ok && data.token) {
                    localStorage.setItem('bbcc_token', data.token);
                    localStorage.setItem('bbcc_auth_token', data.token);
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('bbcc_user_email', email);
                    localStorage.setItem('bbcc_user_role', data.role || 'user');

                    showAlert('Login successful! Redirecting...', false);

                    setTimeout(() => {
                        window.location.href = data.redirectUrl || '/admin-console.html';
                    }, 500);
                } else {
                    showAlert(data.message || 'Invalid or expired OTP.', true);
                }
            } catch (err) {
                showAlert('Verification error: ' + err.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Verify & Log In';
            }
        }

        document.getElementById('emailInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleSendOtp();
            }
        });

        document.getElementById('otpInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleVerifyOtp();
            }
        });
    </script>
</body>
</html>
