<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure OTP Login | BBCC SKILL HUB</title>
    <link rel="icon" type="image/png" href="/data/branding/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-dark: #030712;
            --card-bg: rgba(15, 23, 42, 0.95);
            --gold: #fbbf24;
            --emerald: #10b981;
            --cyan: #38bdf8;
            --border-glow: rgba(245, 158, 11, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(245, 158, 11, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.05) 0%, transparent 50%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }

        .login-card {
            max-width: 440px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 36px 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 30px rgba(245, 158, 11, 0.1);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #f59e0b, #10b981, #38bdf8);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin-bottom: 14px;
            border-radius: 16px;
            border: 1px solid var(--border-glow);
            background: rgba(3, 7, 18, 0.8);
            padding: 6px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            font-weight: 900;
            color: var(--gold);
            letter-spacing: 1.5px;
        }

        .brand-sub {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 12.5px;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            background: rgba(3, 7, 18, 0.85);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            color: #f8fafc;
            padding: 14px 16px;
            font-size: 15px;
            outline: none;
            transition: all 0.25s;
        }

        .form-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
            background: rgba(3, 7, 18, 0.95);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #030712;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.5);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-verify {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
        }

        .btn-verify:hover {
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
        }

        .status-msg {
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            line-height: 1.4;
        }

        .status-msg.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }

        .status-msg.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #6ee7b7;
        }

        .otp-input-box {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 12px;
            border-color: #10b981;
            padding: 12px 8px;
        }

        .email-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            font-size: 13px;
        }

        .email-badge b {
            color: var(--gold);
        }

        .edit-email-btn {
            background: transparent;
            border: none;
            color: var(--cyan);
            font-size: 12px;
            cursor: pointer;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .edit-email-btn:hover {
            background: rgba(56, 189, 248, 0.1);
            text-decoration: underline;
        }

        .timer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            font-size: 12.5px;
            color: #94a3b8;
        }

        .resend-btn {
            background: none;
            border: none;
            color: var(--gold);
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .resend-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            color: #64748b;
        }

        .resend-btn:not(:disabled):hover {
            text-decoration: underline;
        }

        .footer-bar {
            text-align: center;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 12.5px;
            color: #64748b;
        }

        .footer-bar a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer-bar a:hover {
            color: var(--gold);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Brand Header -->
        <div class="brand-header">
            <a href="/">
                <img src="/data/branding/logo.png" alt="BBCC Logo" class="brand-logo" onerror="this.src='/logo.png'">
            </a>
            <h1 class="brand-title">BBCC SKILL HUB</h1>
            <p class="brand-sub">Unified Fast OTP Login Portal</p>
        </div>

        <!-- Status Message Banner -->
        <div class="status-msg" id="statusBox">
            <i class="fas fa-circle-info" id="statusIcon"></i>
            <span id="statusText">Status message</span>
        </div>

        <!-- STEP 1: ENTER EMAIL -->
        <div id="stepEmailContainer">
            <div class="form-group">
                <label class="form-label" for="emailInput">
                    <i class="fas fa-envelope" style="color:var(--gold); margin-right:4px;"></i> Enter Registered Email
                </label>
                <input 
                    type="email" 
                    id="emailInput" 
                    class="form-input" 
                    placeholder="Enter email (e.g. sky140052@gmail.com)" 
                    value="sky140052@gmail.com" 
                    autocomplete="email"
                    required
                >
                <small style="color:#94a3b8; font-size:11.5px; margin-top:6px; display:block;">
                    ⚡ Passwordless Login • We will send a 4-Digit OTP to this email.
                </small>
            </div>

            <button type="button" id="btnSendOtp" class="btn-submit" onclick="sendOtp()">
                <i class="fas fa-paper-plane"></i>
                <span>Send Verification OTP</span>
            </button>
        </div>

        <!-- STEP 2: ENTER OTP (Hidden until OTP is sent) -->
        <div id="stepOtpContainer" style="display:none;">
            <div class="email-badge">
                <span>Code sent to: <b id="displayEmail">email@example.com</b></span>
                <button type="button" class="edit-email-btn" onclick="editEmail()">
                    <i class="fas fa-pen"></i> Change
                </button>
            </div>

            <div class="form-group">
                <label class="form-label" for="otpInput">
                    <i class="fas fa-key" style="color:var(--emerald); margin-right:4px;"></i> Enter 4-Digit OTP Code
                </label>
                <input 
                    type="text" 
                    id="otpInput" 
                    class="form-input otp-input-box" 
                    maxlength="4" 
                    placeholder="••••" 
                    autocomplete="one-time-code"
                >
            </div>

            <button type="button" id="btnVerifyOtp" class="btn-submit btn-verify" onclick="verifyOtp()">
                <i class="fas fa-shield-check"></i>
                <span>Verify &amp; Log In</span>
            </button>

            <div class="timer-row">
                <span id="timerText">OTP valid for 10 minutes</span>
                <button type="button" id="btnResend" class="resend-btn" onclick="sendOtp(true)" disabled>
                    <i class="fas fa-rotate"></i> Resend (<span id="resendCountdown">30</span>s)
                </button>
            </div>
        </div>

        <!-- Footer Bar -->
        <div class="footer-bar">
            <a href="/"><i class="fas fa-arrow-left"></i> Back to Main Portal</a>
            <span style="margin: 0 8px;">•</span>
            <span>Directorate of BBCC</span>
        </div>
    </div>

    <script>
        let countdownTimer = null;
        let countdownSeconds = 30;

        function showStatus(text, type = 'error') {
            const box = document.getElementById('statusBox');
            const icon = document.getElementById('statusIcon');
            const span = document.getElementById('statusText');

            box.className = 'status-msg ' + type;
            icon.className = type === 'error' ? 'fas fa-triangle-exclamation' : 'fas fa-circle-check';
            span.textContent = text;
            box.style.display = 'flex';
        }

        function hideStatus() {
            document.getElementById('statusBox').style.display = 'none';
        }

        function startResendTimer() {
            clearInterval(countdownTimer);
            countdownSeconds = 30;
            const resendBtn = document.getElementById('btnResend');
            const cdSpan = document.getElementById('resendCountdown');
            resendBtn.disabled = true;

            countdownTimer = setInterval(() => {
                countdownSeconds--;
                if (countdownSeconds <= 0) {
                    clearInterval(countdownTimer);
                    resendBtn.disabled = false;
                    resendBtn.innerHTML = '<i class="fas fa-rotate"></i> Resend OTP';
                } else {
                    resendBtn.innerHTML = `<i class="fas fa-rotate"></i> Resend (${countdownSeconds}s)`;
                }
            }, 1000);
        }

        async function sendOtp(isResend = false) {
            const emailInput = document.getElementById('emailInput');
            const email = (emailInput?.value || '').trim().toLowerCase();
            const btn = document.getElementById('btnSendOtp');

            if (!email || !email.includes('@')) {
                showStatus('Please enter a valid email address.', 'error');
                emailInput?.focus();
                return;
            }

            hideStatus();
            if (!isResend) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Dispatching OTP to Email...';
            }

            try {
                const res = await fetch('/api/auth/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    document.getElementById('displayEmail').textContent = email;
                    document.getElementById('stepEmailContainer').style.display = 'none';
                    document.getElementById('stepOtpContainer').style.display = 'block';
                    document.getElementById('otpInput').value = '';
                    document.getElementById('otpInput').focus();

                    showStatus(`Verification code sent to ${email}. Please check your inbox or spam folder.`, 'success');
                    startResendTimer();
                } else {
                    showStatus(data.message || 'Failed to send OTP email. Please try again.', 'error');
                }
            } catch (err) {
                showStatus('Network connection error: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> <span>Send Verification OTP</span>';
            }
        }

        function editEmail() {
            document.getElementById('stepOtpContainer').style.display = 'none';
            document.getElementById('stepEmailContainer').style.display = 'block';
            document.getElementById('emailInput').focus();
            hideStatus();
        }

        async function verifyOtp() {
            const email = (document.getElementById('emailInput')?.value || '').trim().toLowerCase();
            const otpInput = document.getElementById('otpInput');
            const otp = (otpInput?.value || '').trim();
            const btn = document.getElementById('btnVerifyOtp');

            if (!otp || otp.length < 4) {
                showStatus('Please enter the 4-digit code sent to your email.', 'error');
                otpInput?.focus();
                return;
            }

            hideStatus();
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying Access...';

            try {
                const res = await fetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp })
                });

                const data = await res.json();

                if (res.ok && data.token) {
                    // Save tokens for 30-day session
                    localStorage.setItem('bbcc_token', data.token);
                    localStorage.setItem('bbcc_auth_token', data.token);
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('bbcc_user_email', email);
                    localStorage.setItem('bbcc_user_role', data.role || 'student');

                    showStatus('Access Verified! Redirecting...', 'success');

                    // Immediate smart redirection based on role
                    setTimeout(() => {
                        if (data.role === 'superadmin' || email === 'sky140052@gmail.com') {
                            window.location.href = '/admin-console.html';
                        } else if (data.role === 'director') {
                            window.location.href = data.redirectUrl || '/director-portal.html';
                        } else {
                            window.location.href = data.redirectUrl || '/student-dashboard.html';
                        }
                    }, 800);
                } else {
                    showStatus(data.message || 'Invalid or expired OTP code.', 'error');
                }
            } catch (err) {
                showStatus('Verification error: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-shield-check"></i> <span>Verify &amp; Log In</span>';
            }
        }

        // Allow pressing Enter in Email input
        document.getElementById('emailInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendOtp();
            }
        });

        // Allow pressing Enter in OTP input
        document.getElementById('otpInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                verifyOtp();
            }
        });
    </script>
</body>
</html>
